<footer class="site-footer">
  <div class="content">
    <div class="col">
      <h2>{{ siteConfig.siteName }}</h2>
      <p>{{ siteConfig.tagline }}</p>
      <app-whatsapp-cta-button label="WhatsApp'tan Yazın" />
    </div>

    <div class="col">
      <h3>İletişim</h3>
      <ul>
        <li>Telefon: {{ siteConfig.whatsapp.phoneDisplay }}</li>
        <li>E-posta: {{ siteConfig.contactEmail }}</li>
        <li>
          <a [href]="siteConfig.instagram.url" target="_blank" rel="noopener noreferrer">
            Instagram: {{ siteConfig.instagram.handle }}
          </a>
        </li>
      </ul>
    </div>
  </div>

  <p class="copyright">&copy; {{ year }} {{ siteConfig.siteName }}. Tüm hakları saklıdır.</p>
</footer>
