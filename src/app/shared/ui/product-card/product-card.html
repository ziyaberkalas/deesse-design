<article class="product-card">
  <button
    type="button"
    class="favorite-btn"
    [class.active]="isFavorite()"
    (click)="toggleFavorite()"
    [attr.aria-pressed]="isFavorite()"
    [attr.aria-label]="isFavorite() ? 'Favorilerden çıkar' : 'Favorilere ekle'"
  >
    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" [attr.fill]="isFavorite() ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
      <path
        d="M12 21s-6.7-4.35-9.3-8.1C1 10.3 1.6 6.9 4.3 5.4c2.3-1.3 5-0.6 6.4 1.4l1.3 1.8 1.3-1.8c1.4-2 4.1-2.7 6.4-1.4 2.7 1.5 3.3 4.9 1.6 7.5C18.7 16.65 12 21 12 21Z"
      />
    </svg>
  </button>

  <a class="product-card-link" [routerLink]="['/urunler', product().id]">
    <img
      class="thumb"
      [ngSrc]="product().images[0].url"
      [alt]="product().images[0].alt"
      [width]="product().images[0].width"
      [height]="product().images[0].height"
      [priority]="priority()"
    />
    <div class="body">
      <div class="meta-row">
        <span class="category">{{ categoryLabel() }}</span>
        <app-stock-badge [status]="stockStatus()" />
      </div>
      <h3 class="name">{{ product().name }}</h3>
      <p class="short-desc">{{ product().shortDescription }}</p>
      <!-- Hiç yorum yokken 5 boş yıldız "0 puan almış" izlenimi verirdi; gizlemek daha doğru. -->
      @if (product().reviews.length > 0) {
        <app-star-rating [rating]="averageRating()" [reviewCount]="product().reviews.length" />
      }
      <p class="price">
        @if (product().price !== null) {
          {{ product().price | currency: 'TRY' : 'symbol' : '1.0-0' }}
        } @else {
          Fiyat için iletişime geçin
        }
      </p>
    </div>
  </a>
</article>
