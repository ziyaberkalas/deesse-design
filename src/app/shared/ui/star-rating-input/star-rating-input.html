<fieldset class="star-input">
  <legend>{{ legend() }}</legend>
  <div class="options">
    @for (star of stars; track star) {
      <label class="star-option" [class.filled]="star <= rating()">
        <input
          type="radio"
          [name]="name()"
          [value]="star"
          [checked]="rating() === star"
          (change)="select(star)"
        />
        <span class="visually-hidden">{{ star }} yıldız</span>
        <span class="glyph" aria-hidden="true">★</span>
      </label>
    }
  </div>
</fieldset>
