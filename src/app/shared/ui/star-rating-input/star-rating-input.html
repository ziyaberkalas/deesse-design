<fieldset class="star-input">
  <legend>{{ legendText() }}</legend>
  <div class="options">
    @for (star of stars; track star) {
      <label class="star-option" [class.filled]="star <= rating()">
        <input
          type="radio"
          [name]="name()"
          [value]="star"
          [checked]="rating() === star"
          (change)="select(star)"
        />
        <span class="visually-hidden">{{ t().review.starCount(star) }}</span>
        <span class="glyph" aria-hidden="true">★</span>
      </label>
    }
  </div>
</fieldset>
