<section class="contact-page">
  <h1>{{ t().contact.title }}</h1>
  <p>{{ t().contact.intro }}</p>

  <app-whatsapp-cta-button [label]="t().whatsapp.writeUs" />

  <dl class="details">
    <div class="detail-row">
      <dt>{{ t().contact.phone }}</dt>
      <dd>{{ siteConfig.whatsapp.phoneDisplay }}</dd>
    </div>
    <div class="detail-row">
      <dt>{{ t().contact.email }}</dt>
      <dd><a [href]="'mailto:' + siteConfig.contactEmail">{{ siteConfig.contactEmail }}</a></dd>
    </div>
    <div class="detail-row">
      <dt>{{ t().contact.instagram }}</dt>
      <dd>
        <a [href]="siteConfig.instagram.url" target="_blank" rel="noopener noreferrer">
          {{ siteConfig.instagram.handle }}
        </a>
      </dd>
    </div>
    <div class="detail-row">
      <dt>{{ t().contact.store }}</dt>
      <dd>
        <a [href]="siteConfig.shopier.shopUrl" target="_blank" rel="noopener noreferrer">
          {{ t().contact.buyOnShopier }}
        </a>
      </dd>
    </div>
  </dl>
</section>
