<section class="favorites-page">
  <h1>{{ t().favorites.title }}</h1>

  @if (favoriteProducts().length > 0) {
    <div class="grid">
      @for (product of favoriteProducts(); track product.id; let i = $index) {
        <app-product-card [product]="product" [priority]="i < 4" />
      }
    </div>
  } @else {
    <div class="empty">
      <p>{{ t().favorites.empty }}</p>
      <a routerLink="/urunler">{{ t().favorites.exploreLink }}</a>
    </div>
  }
</section>
