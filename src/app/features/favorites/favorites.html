<section class="favorites-page">
  <h1>Favorilerim</h1>

  @if (favoriteProducts().length > 0) {
    <div class="grid">
      @for (product of favoriteProducts(); track product.id; let i = $index) {
        <app-product-card [product]="product" [priority]="i === 0" />
      }
    </div>
  } @else {
    <div class="empty">
      <p>Henüz favori ürününüz yok.</p>
      <a routerLink="/urunler">Tasarımları keşfedin</a>
    </div>
  }
</section>
